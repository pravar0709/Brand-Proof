services:
  - type: web
    name: brandproof
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /healthz
